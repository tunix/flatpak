# Rebuilds the named app into the OSTree repo and republishes the signed
# summary to gh-pages. Triggered by app repos via repository_dispatch.
name: Update flatpak repo

on:
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:
    inputs:
      app_id:
        description: "App id (e.g. io.github.tunix.valhalla)"
        required: true
        type: string
      tag:
        description: "Git tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    name: Build ${{ inputs.app_id || github.event.client_payload.app_id }}
    runs-on: ubuntu-latest
    # The runner image does not ship flatpak-builder; this container owns the
    # whole toolchain (flatpak, flatpak-builder, flathub remote) and is
    # multi-arch. --privileged is required for flatpak sandboxing.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    env:
      # workflow_dispatch fills inputs; repository_dispatch fills
      # github.event.client_payload. Either path must yield both values.
      APP_ID: ${{ inputs.app_id || github.event.client_payload.app_id }}
      TAG: ${{ inputs.tag || github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control

      - name: Sanity-check inputs
        run: |
          set -eu
          test -f "control/apps/${APP_ID}.json" || {
            echo "::error::control/apps/${APP_ID}.json missing"; exit 1; }

      # Pull the existing published repo so prior builds survive and old
      # installs keep updating against them.
      - name: Restore existing OSTree repo from gh-pages
        run: |
          set -eu
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            published 2>/dev/null || mkdir published
          mkdir -p repo
          if [ -d published/repo ]; then cp -a published/repo/. repo/; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Clone the app at the requested tag. The manifest's first module source
      # is rewritten to reference this clone via type:dir so flatpak-builder
      # builds the checked-out tag, and generated-sources.json is regenerated
      # from the app's Cargo.lock (checked-in copies drift behind renovate).
      - name: Clone app source at tag and prepare manifest
        run: |
          set -eu
          APP_URL=$(python3 -c "
          import json
          m = json.load(open('control/apps/${APP_ID}.json'))
          s = [x for x in m['modules'][0]['sources']
               if isinstance(x, dict) and x.get('type') == 'git'][0]
          print(s['url'])")
          git clone --depth 1 --branch "${TAG}" "${APP_URL}" app
          cd app
          if [ -f Cargo.lock ] && [ -d flatpak ]; then
            python3 -m venv .venv-flatpak
            .venv-flatpak/bin/pip install -q 'aiohttp<4.0.0,>=3.9.5' 'PyYAML<7.0.0,>=6.0.2' 'tomlkit>=0.13.3,<1.0'
            .venv-flatpak/bin/python flatpak/flatpak-cargo-generator.py Cargo.lock \
              -o flatpak/generated-sources.json
            # The bare 'generated-sources.json' entry in the manifest resolves
            # against the manifest's directory (control/apps/), NOT the app
            # clone — publish the regenerated file there.
            cp flatpak/generated-sources.json "../control/apps/generated-sources.json"
          fi
          cd ..
          # Point the manifest's app source at the local clone. The path
          # must be absolute: flatpak-builder resolves type:dir paths relative
          # to the MANIFEST's directory (control/apps/), not the workspace.
          python3 - "$APP_ID" "$GITHUB_WORKSPACE" <<'PY'
          import json, sys
          app_id, ws = sys.argv[1], sys.argv[2]
          p = f'control/apps/{app_id}.json'
          m = json.load(open(p))
          for x in m['modules'][0]['sources']:
              if isinstance(x, dict) and x.get('type') == 'git':
                  x.clear(); x.update({'type': 'dir', 'path': f'{ws}/app'})
          json.dump(m, open(p, 'w'), indent=2)
          PY

      # The app's metainfo lags one release behind its tag by design: the app
      # repo syncs <releases> from the changelog via a follow-up PR that can
      # only land AFTER the tag is cut, so a tag build would always publish
      # the previous version's appstream (1.3.2 shipped reporting 1.3.1 in
      # flatpak list/info). Regenerate <releases> from the tag's own
      # changelog before building. Apps without the sync script are skipped.
      - name: Sync appstream <releases> from the tag's changelog
        run: |
          set -eu
          if [ -f app/scripts/update_metainfo.py ] && [ -f app/CHANGELOG.md ]; then
            META=$(ls app/data/*.metainfo.xml 2>/dev/null | head -1)
            test -n "${META}" || { echo "no metainfo under app/data - skipping sync"; exit 0; }
            # update_metainfo.py exits 1 when it rewrote the file (0 = current,
            # 2 = error); the default step shell is bash -e, map 1 to success.
            python3 app/scripts/update_metainfo.py app/CHANGELOG.md "${META}" || [ $? -eq 1 ]
          else
            echo "no metainfo sync script in the app clone - skipping"
          fi

      - name: Import GPG key
        id: gpg
        run: |
          set -eu
          echo "${{ secrets.GPG_KEY }}" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "keyid=${KEYID}" >> "$GITHUB_OUTPUT"

      - name: flatpak-builder
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # master @ 7932741 (node24)
        with:
          repo-dir: repo
          manifest-path: control/apps/${{ env.APP_ID }}.json
          branch: stable
          cache-key: flatpak-builder-${{ env.APP_ID }}-${{ env.TAG }}
          gpg-sign: ${{ steps.gpg.outputs.keyid }}

      - name: Regenerate signed summary with static deltas
        run: |
          set -eu
          # build-update-repo lists refs/remotes (remote-mirror cache) and
          # fails when the directory is missing on a restored repo.
          mkdir -p repo/refs/remotes
          flatpak build-update-repo \
            --gpg-sign="${{ steps.gpg.outputs.keyid }}" \
            --generate-static-deltas --prune repo

      - name: Publish to gh-pages
        run: |
          set -eu
          if [ ! -d published/.git ]; then
            cd published && git init -b gh-pages . && \
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            cd ..
          fi
          cd published
          git config user.name "flatpak-repo-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf repo && cp -a ../repo repo
          cp -a ../control/apps/*.flatpakref . 2>/dev/null || true
          cp -a ../control/tunix.flatpakrepo .
          git add -A
          git commit -m "Update repo: ${APP_ID} @ ${TAG}" || { echo "no changes"; exit 0; }
          git push -f origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The canonical domain (alperkan.at) is fronted by Cloudflare whose edge
      # cache (observed max-age=14400) can serve stale summary/refs pairs for
      # hours after a publish — mismatched pairs even fail GPG verification
      # ("BAD signature": summary from build N, sig from build N-1). Purge the
      # fixed-name files; everything else is content-addressed, hence
      # immutable. Skipped when the Cloudflare secrets are not configured.
      - name: Purge fixed-name repo files from the CDN
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        if: env.CF_TOKEN != '' && env.CF_ZONE != ''
        run: |
          set -eu
          BASE="https://alperkan.at/flatpak/repo"
          FILES=(
            "$BASE/summary" "$BASE/summary.sig"
            "$BASE/summary.idx" "$BASE/summary.idx.sig"
            "$BASE/refs/heads/app/${APP_ID}/x86_64/stable"
            "$BASE/refs/heads/app/${APP_ID}/aarch64/stable"
            "$BASE/refs/heads/appstream/x86_64"
            "$BASE/refs/heads/appstream/aarch64"
            "$BASE/refs/heads/appstream2/x86_64"
            "$BASE/refs/heads/appstream2/aarch64"
          )
          # NOTE: python3 -c rejects indented top-level statements; the code
          # must sit at the block scalar's strip column (0 after stripping).
          PAYLOAD=$(python3 -c '
          import json, sys
          print(json.dumps({"files": sys.argv[1:]}))' "${FILES[@]}")
          curl -sSf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" > /tmp/purge.json
          python3 - /tmp/purge.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          if not r.get("success"):
              print(r); sys.exit(1)
          print("CDN purge OK")
          PY